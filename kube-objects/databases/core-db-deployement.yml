apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-postgres
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "labadmin"
        - name: POSTGRES_PASSWORD
          value: "labsecret123"
        - name: POSTGRES_DB
          value: "authentik_db" # On prépare déjà la base pour Authentik
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"